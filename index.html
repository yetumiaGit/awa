<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>CIFEPE - Communauté Internationale des Femmes de Plein Évangile</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        secondary: '#db2777',
                        accent: '#f59e0b',
                        dark: '#0f172a',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Force le reflow/redraw immédiat pour éviter le décalage initial */
        img, .grid, .flex, .container, section, div {
            will-change: transform, opacity;
        }
        
        /* Éviter les décalages de layout */
        img {
            aspect-ratio: attr(width) / attr(height);
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .glass { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .dark .glass { 
            background: rgba(15, 23, 42, 0.95); 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .icon { 
            width: 22px; 
            height: 22px; 
            stroke: currentColor; 
            stroke-width: 1.8; 
            fill: none; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
        }
        
        .social-icon { 
            width: 20px; 
            height: 20px; 
            fill: currentColor; 
            stroke: none; 
            transition: all 0.2s ease; 
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 10px; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        
        button, a, [role="button"] { cursor: pointer; touch-action: manipulation; }
        html { scroll-behavior: smooth; }
        
        .book-cover { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .book-cover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.2); }
        
        /* Styles pour le chat modal centré */
        .chat-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-modal-content {
            width: 90%;
            max-width: 500px;
            height: 70vh;
            max-height: 600px;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .dark .chat-modal-content {
            background: #1f2937;
        }
        
        @media (max-width: 640px) {
            .chat-modal-content {
                width: 95%;
                height: 80vh;
                max-height: 85vh;
                border-radius: 24px;
            }
        }
        
        @media (min-width: 1024px) {
            .chat-modal-content {
                max-width: 550px;
                height: 65vh;
                max-height: 650px;
            }
        }
        
        /* Style pour les images responsives */
        .flickr-image {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .flickr-image:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 25px -12px rgba(0,0,0,0.2);
        }
        
        /* Logo container */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-img {
            max-height: 42px;
            width: auto;
            display: block;
            object-fit: contain;
        }
        @media (max-width: 768px) {
            .logo-img {
                max-height: 36px;
            }
        }
        
        /* Hero overlay */
        .hero-overlay {
            background: linear-gradient(135deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.5) 100%);
        }
        
        /* Animations pour la galerie des femmes */
        .image-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .image-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 35px -12px rgba(0,0,0,0.25);
        }
        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        .scroll-reveal-left {
            opacity: 0;
            transform: translateX(-30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .scroll-reveal-left.revealed {
            opacity: 1;
            transform: translateX(0);
        }
        .scroll-reveal-right {
            opacity: 0;
            transform: translateX(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .scroll-reveal-right.revealed {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* Footer styles */
        .footer-link {
            transition: color 0.2s ease;
        }
        .footer-link:hover {
            color: #7c3aed;
        }
        .dark .footer-link:hover {
            color: #a78bfa;
        }
        
        /* Animation zoom in/out continue pour les images de la section "Rejoindre" */
        @keyframes gentleZoom {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .zoom-animate {
            animation: gentleZoom 8s ease-in-out infinite;
        }
        
        /* Animation de balayage latéral subtile pour la photo de la fondatrice */
        @keyframes subtleSway {
            0% {
                transform: translateX(-3%) scale(1.02);
            }
            50% {
                transform: translateX(3%) scale(1.02);
            }
            100% {
                transform: translateX(-3%) scale(1.02);
            }
        }
        
        .founder-sway {
            animation: subtleSway 12s ease-in-out infinite;
            transform-origin: center center;
        }
    </style>
</head>

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsRevealed(true);
                            observer.disconnect();
                        }
                    },
                    { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            
            let className = '';
            if (direction === 'up') className = 'scroll-reveal';
            else if (direction === 'left') className = 'scroll-reveal-left';
            else if (direction === 'right') className = 'scroll-reveal-right';
            
            return (
                <div ref={ref} className={`${className} ${isRevealed ? 'revealed' : ''}`} style={{ transitionDelay: `${delay}ms` }}>

        };

        // --- AUTRES PAGES ---
        const EbookPage = ({ addToast, scrollToTop }) => { useEffect(() => { scrollToTop(); }, [scrollToTop]); return (<motion.div className="max-w-7xl mx-auto px-4 py-12"><SectionTitle title="Bibliothèque CIFEPE" subtitle="Livres électroniques gratuits sur les Évangiles et la vie communautaire." /><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 md:gap-6 mt-8">{CONTENT.ebooks.map((book, idx) => (<Card key={idx} hover className="flex flex-col h-full"><div className="rounded-xl overflow-hidden mb-4 shadow-md book-cover"><img src={book.cover} alt={book.title} className="w-full h-48 md:h-56 object-cover" /></div><h3 className="text-lg md:text-xl font-bold mb-2">{book.title}</h3><p className="text-gray-500 text-xs md:text-sm mb-5 flex-grow">{book.desc}</p><Button variant="secondary" className="w-full py-2 text-xs md:text-sm" icon="Download" onClick={() => addToast(`📖 "${book.title}" téléchargement simulé`, "success")}>Télécharger gratuit</Button></Card>))}</div></motion.div>); };
        
        const PrayersPage = ({ addToast, scrollToTop }) => { useEffect(() => { scrollToTop(); }, [scrollToTop]); return (<motion.div className="max-w-4xl mx-auto px-4 py-12"><SectionTitle title="Temps de Prière" subtitle="Sessions en ligne, 4 fois par semaine." /><div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-12">{['Lundi 19h', 'Mercredi 19h', 'Vendredi 20h', 'Dimanche 09h'].map((time,i)=><Card key={i} className="flex items-center gap-3 md:gap-4 p-4 md:p-5"><Icon name="Clock" className="text-primary" size={24} /><div><h3 className="font-bold text-sm md:text-base">{time}</h3><p className="text-xs text-gray-500">Enseignement & Intercession</p><button className="text-primary text-xs md:text-sm font-medium mt-1">Rejoindre</button></div></Card>)}</div><Card><div><h3 className="text-xl md:text-2xl font-bold mb-2">Besoin de prière ?</h3><form onSubmit={(e)=>{e.preventDefault();addToast("Demande envoyée, nous prions pour vous.","success");}} className="space-y-4"><input placeholder="Nom" className="w-full p-3 rounded-xl border dark:bg-gray-800 dark:border-gray-700 text-base" /><textarea rows="2" placeholder="Sujet de prière" className="w-full p-3 rounded-xl border dark:bg-gray-800 dark:border-gray-700 text-base"></textarea><Button type="submit">Envoyer</Button></form></div></Card></motion.div>); };
        
        const JoinPage = ({ addToast, setPage, scrollToTop }) => { useEffect(() => { scrollToTop(); }, [scrollToTop]); return (<motion.div className="max-w-2xl mx-auto px-4 py-12"><Card><h2 className="text-xl md:text-2xl font-bold text-center mb-4">Rejoignez la CIFEPE</h2><div className="bg-gray-50 dark:bg-gray-900/80 p-4 rounded-xl mb-6"><h3 className="font-bold mb-2 text-sm md:text-base">Conditions :</h3><ul className="space-y-1 text-xs md:text-sm">{CONTENT.joinCriteria.map((c,i)=><li key={i} className="flex gap-2"><span className="text-primary">✓</span>{c}</li>)}</ul></div><form onSubmit={(e)=>{e.preventDefault();addToast("Bienvenue dans la famille CIFEPE !","success");setPage('home');scrollToTop();}} className="space-y-3"><input placeholder="Prénom" required className="w-full p-3 rounded-xl border dark:bg-gray-800 dark:border-gray-700 text-base" /><input placeholder="Email" type="email" required className="w-full p-3 rounded-xl border dark:bg-gray-800 dark:border-gray-700 text-base" /><Button type="submit" className="w-full">Valider mon adhésion</Button></form></Card></motion.div>); };

        // --- HOMEPAGE ---
        const HomePage = ({ setPage, scrollToTop }) => (
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                <section className="relative min-h-[85vh] md:min-h-[80vh] flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0 z-0"><img src={FLICKR_IMAGES.heroBg} className="w-full h-full object-cover object-center" alt="Bannière CIFEPE" /><div className="absolute inset-0 hero-overlay"></div></div>
                    <div className="relative z-10 text-center px-5 max-w-5xl mx-auto"><motion.div initial={{ y: 30, opacity: 0 }} animate={{ y: 0, opacity: 1 }}><span className="inline-block py-1 px-3 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white text-xs font-medium mb-4">✨ Communauté Internationale des Femmes de Plein Évangile</span><h1 className="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold text-white mb-4 leading-tight">{CONTENT.hero.title}</h1><p className="text-base md:text-lg text-gray-200 mb-8 max-w-2xl mx-auto">{CONTENT.hero.subtitle}</p><div className="flex flex-col sm:flex-row gap-3 justify-center items-center"><Button onClick={() => { setPage('join'); scrollToTop(); }} icon="UserPlus">{CONTENT.hero.cta1}</Button><Button variant="outline" onClick={() => { setPage('donate'); scrollToTop(); }} icon="Heart">{CONTENT.hero.cta2}</Button></div></motion.div></div>
                </section>
                <section className="py-12 md:py-16 bg-white dark:bg-dark"><div className="max-w-7xl mx-auto px-4"><div className="grid md:grid-cols-2 gap-8 items-start"><ScrollReveal direction="left"><div><SectionTitle title="Qui sommes-nous ?" align="left" /><p className="text-gray-700 dark:text-gray-300 mb-6 leading-relaxed text-base md:text-lg">La CIFEPE est une communauté chrétienne engagée dans la transformation spirituelle, sociale et économique des femmes.</p><div className="space-y-6"><div className="flex gap-4"><div className="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary shrink-0"><Icon name="Target" size={26} /></div><div><h3 className="font-bold text-lg md:text-xl mb-2">Notre Mission</h3><p className="text-gray-600 dark:text-gray-400 text-base leading-relaxed">{CONTENT.about.mission}</p></div></div><div className="flex gap-4"><div className="w-12 h-12 rounded-xl bg-secondary/10 flex items-center justify-center text-secondary shrink-0"><Icon name="Eye" size={26} /></div><div><h3 className="font-bold text-lg md:text-xl mb-2">Notre Vision</h3><p className="text-gray-600 dark:text-gray-400 text-base leading-relaxed">{CONTENT.about.vision}</p></div></div></div></div></ScrollReveal><ScrollReveal direction="right"><Card className="bg-gray-50 dark:bg-gray-800/60 p-6"><div className="flex items-center gap-3 mb-4"><Icon name="History" size={28} /><h3 className="text-xl font-bold">Notre Histoire</h3></div><p className="text-gray-700 dark:text-gray-300 text-base leading-relaxed">{CONTENT.about.history}</p></Card></ScrollReveal></div></div></section>
                <section className="py-12 bg-gray-50 dark:bg-gray-900"><div className="max-w-7xl mx-auto px-4"><SectionTitle title="Nos Domaines d'Action" /><div className="grid grid-cols-2 md:grid-cols-4 gap-4">{CONTENT.actions.map((action,i)=><ScrollReveal key={i} direction="up" delay={i*50}><Card hover className="text-center p-4"><div className="w-12 h-12 mx-auto mb-3 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center"><Icon name={action.icon} size={24} className="text-primary" /></div><h3 className="font-bold text-base">{action.title}</h3><p className="text-gray-500 text-xs mt-1">{action.desc}</p></Card></ScrollReveal>)}</div></div></section>
                <ValuesSection />
                <ProjectSection />
                <JoinForceSection setPage={setPage} scrollToTop={scrollToTop} />
                <FounderPreview />
                <section className="py-12 bg-white dark:bg-dark"><div className="max-w-7xl mx-auto px-4"><SectionTitle title="Nos Actions en Images" subtitle="Un aperçu de nos moments de partage et de transformation" /><div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-5 mb-8">{CONTENT.galleryItems.slice(0, 3).map((item, idx) => (<ScrollReveal key={item.id} direction="up" delay={idx*100}><div className="rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300"><img src={item.image} alt={item.description} className="w-full h-48 md:h-56 object-cover hover:scale-105 transition-transform duration-500" /><div className="p-3 bg-gray-50 dark:bg-gray-800"><p className="text-xs md:text-sm font-medium text-gray-700 dark:text-gray-300">{item.description}</p><div className="flex items-center gap-2 text-xs text-primary mt-1"><Icon name="MapPin" size={12} /> {item.city} • {item.date}</div></div></div></ScrollReveal>))}</div><div className="text-center"><Button onClick={() => { setPage('gallery'); scrollToTop(); }} icon="Image" variant="secondary">Voir toute la galerie</Button></div></div></section>
            </motion.div>
        );

        // --- MAIN APP ---
        const App = () => {
            const [page, setPage] = useState('home');
            const [isDark, setIsDark] = useState(false);
            const [toast, setToast] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [isChatOpen, setIsChatOpen] = useState(false);
            
            const scrollToTop = useCallback(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, []);
            
            useEffect(() => { scrollToTop(); }, [page, scrollToTop]);
            useEffect(() => { if (isDark) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDark]);
            
            // Forcer le reflow après le chargement pour éviter les problèmes de layout
            useEffect(() => {
                window.dispatchEvent(new Event('resize'));
                setTimeout(() => {
                    window.scrollBy(0, 1);
                    window.scrollBy(0, -1);
                }, 10);
            }, []);
            
            const addToast = (msg, type) => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };
            const renderPage = () => { 
                switch(page) { 
                    case 'home': return <HomePage setPage={setPage} scrollToTop={scrollToTop} />; 
                    case 'ebooks': return <EbookPage addToast={addToast} scrollToTop={scrollToTop} />; 
                    case 'prayers': return <PrayersPage addToast={addToast} scrollToTop={scrollToTop} />; 
                    case 'donate': return <DonatePage addToast={addToast} scrollToTop={scrollToTop} />; 
                    case 'join': return <JoinPage addToast={addToast} setPage={setPage} scrollToTop={scrollToTop} />; 
                    case 'gallery': return <GalleryDetailPage scrollToTop={scrollToTop} />; 
                    default: return <HomePage setPage={setPage} scrollToTop={scrollToTop} />; 
                } 
            };
            
            const navItems = [{ label: 'Accueil', id: 'home' },{ label: 'E-books', id: 'ebooks' },{ label: 'Galerie', id: 'gallery' },{ label: 'Prières', id: 'prayers' },{ label: 'Don', id: 'donate' }];
            const handleNav = (id) => { setPage(id); setMobileMenuOpen(false); scrollToTop(); };
            
            const Footer = () => (
                <footer className="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 pt-12 pb-6">
                    <div className="max-w-7xl mx-auto px-4">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                            <div className="col-span-1 md:col-span-1">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="logo-container">
                                        <img src={FLICKR_IMAGES.logo} alt="CIFEPE Logo" className="logo-img" width="150" />
                                    </div>
                                    <span className="font-bold text-xl text-gray-800 dark:text-white">CIFEPE</span>
                                </div>
                                <p className="text-gray-500 dark:text-gray-400 text-sm leading-relaxed">
                                    Communauté Internationale des Femmes de Plein Évangile.
                                </p>
                            </div>
                            <div>
                                <h3 className="font-semibold text-gray-800 dark:text-white mb-4">Liens rapides</h3>
                                <ul className="space-y-2">
                                    {navItems.map(item => (
                                        <li key={item.id}>
                                            <button onClick={() => handleNav(item.id)} className="footer-link text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary text-sm transition">
                                                {item.label}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <div>
                                <h3 className="font-semibold text-gray-800 dark:text-white mb-4">Contact</h3>
                                <ul className="space-y-2 text-sm text-gray-500 dark:text-gray-400">
                                    <li className="flex items-center gap-2"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg> contact@cifepe.org</li>
                                    <li className="flex items-center gap-2"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg> Lubumbashi, RDC</li>
                                </ul>
                            </div>
                            <div>
                                <h3 className="font-semibold text-gray-800 dark:text-white mb-4">Suivez-nous</h3>
                                <div className="flex gap-3"><SocialLink platform="X" href="#" /><SocialLink platform="Facebook" href="#" /><SocialLink platform="YouTube" href="#" /><SocialLink platform="Instagram" href="#" /></div>
                            </div>
                        </div>
                        <div className="border-t border-gray-200 dark:border-gray-800 pt-6 text-center"><p className="text-gray-400 dark:text-gray-500 text-sm">Copyright © 2026 CIFEPE. Tous droits réservés.</p></div>
                    </div>
                </footer>
            );
            
            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="fixed top-0 w-full z-40 glass">
                        <div className="max-w-7xl mx-auto px-4">
                            <div className="flex justify-between items-center h-14">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={()=>handleNav('home')}>
                                    <div className="logo-container"><img src={FLICKR_IMAGES.logo} alt="CIFEPE Logo" className="logo-img" width="150" /></div>
                                    <span className="font-bold text-base">CIFEPE</span>
                                </div>
                                <div className="hidden md:flex items-center gap-4">
                                    {navItems.map(item=><button key={item.id} onClick={()=>handleNav(item.id)} className={`text-sm font-medium transition ${page===item.id?'text-primary':'text-gray-600 dark:text-gray-300'}`}>{item.label}</button>)}
                                    <Button variant="primary" className="!py-1.5 !px-4 text-sm" onClick={()=>handleNav('join')}>Rejoindre</Button>
                                    <button onClick={()=>setIsDark(!isDark)} className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center"><Icon name={isDark?"Sun":"Moon"} size={18}/></button>
                                </div>
                                <div className="flex md:hidden items-center gap-1">
                                    <button onClick={()=>setIsDark(!isDark)} className="p-2 rounded-full flex items-center justify-center"><Icon name={isDark?"Sun":"Moon"} size={18}/></button>
                                    <button onClick={()=>setMobileMenuOpen(!mobileMenuOpen)} className="p-2 rounded-full flex items-center justify-center"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={mobileMenuOpen?"M6 18L18 6M6 6l12 12":"M4 6h16M4 12h16M4 18h16"}/></svg></button>
                                </div>
                            </div>
                            <AnimatePresence>{mobileMenuOpen && (<motion.div initial={{ opacity:0, height:0 }} animate={{ opacity:1, height:'auto' }} exit={{ opacity:0, height:0 }} className="md:hidden overflow-hidden border-t py-3 space-y-2">{navItems.map(item=><button key={item.id} onClick={()=>handleNav(item.id)} className={`block w-full text-left px-2 py-2 text-base ${page===item.id?'text-primary font-semibold':'text-gray-600 dark:text-gray-300'}`}>{item.label}</button>)}<Button variant="primary" className="w-full justify-center mt-1" onClick={()=>handleNav('join')}>Rejoindre</Button></motion.div>)}</AnimatePresence>
                        </div>
                    </nav>
                    <main className="flex-grow pt-14"><AnimatePresence mode="wait">{renderPage()}</AnimatePresence></main>
                    <Footer />
                    <button onClick={() => setIsChatOpen(true)} className="fixed bottom-5 right-5 z-50 w-14 h-14 bg-gradient-to-r from-primary to-secondary rounded-full shadow-lg flex items-center justify-center text-white hover:scale-110 transition-all duration-300"><Icon name="MessageCircle" size={26} /></button>
                    <ChatModal isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} />
                    <AnimatePresence>{toast && (<motion.div initial={{ opacity:0,y:50}} animate={{ opacity:1,y:0}} exit={{ opacity:0,y:50}} className={`fixed bottom-24 right-4 px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 z-50 text-sm ${toast.type==='success'?'bg-green-600 text-white':'bg-red-600'}`}><Icon name="CheckCircle"/><span>{toast.msg}</span></motion.div>)}</AnimatePresence>
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
